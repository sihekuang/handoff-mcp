name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:standalone

      - name: Package tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd .next/standalone
          tar czf ../../handoff-mcp-${VERSION}.tar.gz .
          cd ../..

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: handoff-mcp-*.tar.gz
          generate_release_notes: true

      - name: Update Homebrew formula
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARBALL="handoff-mcp-${VERSION}.tar.gz"
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          URL="https://github.com/sihekuang/handoff-mcp/releases/download/${GITHUB_REF_NAME}/${TARBALL}"

          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/handoff-mcp.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/handoff-mcp.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/formula-v${VERSION}"
          git checkout -b "$BRANCH"
          git add Formula/handoff-mcp.rb
          git commit -m "chore: update formula to v${VERSION}"
          git push origin "$BRANCH"

      - name: Create formula PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh pr create \
            --title "chore: update Homebrew formula to v${VERSION}" \
            --body "Auto-generated by release workflow. Merge to make \`brew install\` pick up v${VERSION}." \
            --base main
